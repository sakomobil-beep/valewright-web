<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" width="400" height="470">
  <defs>
    <radialGradient id="glow" cx="50%" cy="62%" r="45%">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#e8742a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#e8742a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1d27a"/><stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1a10"/><stop offset="1" stop-color="#4a2a17"/>
    </linearGradient>
    <clipPath id="c"><circle cx="200" cy="190" r="160"/></clipPath>
  </defs>
  <!-- Badge -->
  <circle cx="200" cy="190" r="178" fill="#1e130b"/>
  <circle cx="200" cy="190" r="172" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <g clip-path="url(#c)">
    <rect x="20" y="20" width="360" height="340" fill="url(#sky)"/>
    <circle cx="200" cy="250" r="190" fill="url(#glow)"/>
    <!-- Odenwald-Hügel -->
    <path d="M20 250 Q90 190 160 235 Q230 180 300 225 Q350 200 380 220 V360 H20Z" fill="#2f3d22"/>
    <path d="M20 280 Q110 240 200 275 Q290 240 380 270 V360 H20Z" fill="#24301a"/>
    <!-- Fachwerk-Giebel -->
    <g>
      <path d="M120 300 V185 L200 108 L280 185 V300Z" fill="#ead9b8"/>
      <g stroke="#4a2a17" stroke-width="9" stroke-linecap="square" fill="none">
        <path d="M112 192 L200 106 L288 192"/>
        <path d="M120 188 V300 M280 188 V300 M200 112 V300"/>
        <path d="M120 240 H280 M138 168 H262"/>
        <path d="M120 188 L200 240 L280 188 M120 300 L160 240 M280 300 L240 240"/>
        <path d="M160 168 L200 130 L240 168"/>
      </g>
      <!-- Tor mit Feuerschein -->
      <path d="M176 300 V268 Q200 248 224 268 V300Z" fill="#ff9a3c"/>
      <path d="M176 300 V268 Q200 248 224 268 V300Z" fill="none" stroke="#4a2a17" stroke-width="6"/>
    </g>
    <!-- Boden -->
    <rect x="20" y="300" width="360" height="60" fill="#1a110a"/>
  </g>
  <!-- Amboss -->
  <g transform="translate(200 318)">
    <path d="M-78 -22 H58 Q86 -22 96 -38 Q92 -6 60 0 H34 L26 14 H44 V26 H-44 V14 H-26 L-34 0 H-58 Q-78 -2 -78 -22Z" fill="#2a2a2e" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-72 -20 H56" stroke="#6b6b73" stroke-width="3"/>
  </g>
  <!-- Hammer -->
  <g transform="translate(232 262) rotate(-35)">
    <rect x="-4" y="-6" width="8" height="66" rx="3" fill="#8a5a30" stroke="#3a2414" stroke-width="2"/>
    <rect x="-22" y="-20" width="44" height="18" rx="3" fill="#3b3b42" stroke="url(#gold)" stroke-width="3"/>
  </g>
  <!-- Funken -->
  <g fill="#ffd36b">
    <circle cx="170" cy="282" r="3.2"/><circle cx="152" cy="270" r="2.4"/><circle cx="182" cy="262" r="2"/>
    <circle cx="140" cy="286" r="1.8"/><circle cx="164" cy="252" r="1.6"/>
  </g>
  <!-- Schriftband -->
  <path d="M30 368 H370 L350 400 L370 432 H30 L50 400Z" fill="#3a2414" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>
  <text x="200" y="414" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" letter-spacing="3" fill="url(#gold)">ODENFORGE</text>
  <text x="200" y="462" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="5" fill="#c9a24a">GAMES AUS DEM ODENWALD</text>
</svg>
